[project]
name = "credit-default-agent"
version = "0.1.0"
description = "Deep-agents boilerplate: an orchestrator + ML sub-agents pipeline over the UCI Default of Credit Card Clients dataset"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.10",
    "langchain-anthropic>=0.3",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=3.0,<4.0",
    "optuna>=4.0",
    "shap>=0.46",
    "ucimlrepo>=0.0.7",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_agent"]
